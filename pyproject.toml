[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# PyPI 上的 `mcctl` 已被无关的第三方项目占用，故发行包名用 mcd-mcctl；
# Python 导入名与命令行入口仍为 mcctl（见 [project.scripts]）。
name = "mcd-mcctl"
version = "1.0.0"
description = "mcctl — 麦门的 kubectl：麦当劳中国 MCP 的命令行控制面与智能体 Skill（人格决策 / 控卡配餐 / 一键省钱 / 安全下单 / 积分派对）"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "mcctl contributors" }]
keywords = ["mcp", "mcdonalds", "麦当劳", "cli", "skill", "model-context-protocol", "1024", "mcctl"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
]

[project.optional-dependencies]
# 真实连接麦当劳 MCP 需要官方 SDK；仅体验离线演示（--mock）可不安装
mcp = ["mcp>=1.2"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
mcctl = "mcctl.cli:app"

[project.urls]
Homepage = "https://github.com/hulinkang9527/mcctl"
Repository = "https://github.com/hulinkang9527/mcctl"
Documentation = "https://github.com/hulinkang9527/mcctl#readme"
Changelog = "https://github.com/hulinkang9527/mcctl/releases"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mcctl = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
